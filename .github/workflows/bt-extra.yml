name: 回測補充資料（暫時，用完就刪）
on:
  push:
    branches: [backtest]
    paths: [bt/extra.py]
permissions:
  contents: write
jobs:
  extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          python bt/extra.py
