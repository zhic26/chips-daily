name: 十年回測補充資料（暫時，用完就刪）
on:
  push:
    branches: [backtest]
    paths: [bt/extra10.py]
permissions:
  contents: write
jobs:
  extra:
    strategy:
      fail-fast: false
      matrix:
        job: [twt49u, rev]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          python bt/extra10.py ${{ matrix.job }}
