name: 每日更新

on:
  # GitHub 的排程常常晚一小時左右、偶爾會跳過，所以多排幾次：哪次先跑到就先更新，之後幾次資料沒變就什麼都不做。
  # 時間是 UTC（台北減 8 小時）。
  schedule:
    - cron: "40 13 * * 1-5"   # 台北週一到週五 21:40（融資融券約 21:30 公布，還沒出來的話這次先不計融資）
    - cron: "10 14 * * 1-5"   # 台北 22:10
    - cron: "40 14 * * 1-5"   # 台北 22:40
    - cron: "20 15 * * 1-5"   # 台北 23:20
    - cron: "30 22 * * 1-5"   # 台北隔天早上 06:30：補抓晚到或更正的資料、更新美股收盤
    - cron: "20 23 * * 1-5"   # 台北隔天早上 07:20
    - cron: "50 23 * * 1-5"   # 台北隔天早上 07:50（開盤前最後一次）
  workflow_dispatch:
    inputs:
      date:
        description: "指定日期（YYYY-MM-DD，留空 = 最近一個交易日）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 程式自我測試（不連網，沒過就不更新）
        run: python -m unittest discover -s tests -t .

      - name: 下載資料、計算分數、產生網頁
        env:
          TARGET_DATE: ${{ inputs.date }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          mkdir -p data/meta
          python update.py "$TARGET_DATE" 2>&1 | tee data/meta/last_run.log

      # 失敗時也存回執行紀錄（data/meta/last_run.log），方便查原因
      - name: 存回 repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "沒有新資料，不需要更新"
            exit 0
          fi
          git commit -m "資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
